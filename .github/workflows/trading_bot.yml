name: Alpaca Daily Rebalancing Bot

on:
  schedule:
    # Runs at 21:30 UTC (4:30 PM EST) Monday through Friday
    - cron: '30 21 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually via the GitHub UI

jobs:
  trade:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-python-version: '3.11'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install alpaca-py

    - name: Execute Trading Script
      env:
        # Securely pass variables from GitHub secrets to environment
        ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
        ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      run: python bot.py
